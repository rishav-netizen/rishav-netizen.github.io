  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="34" font-weight="800" fill="url(#omegaGrad)" text-anchor="middle" filter="url(#glow)">Ω</text>
  <circle cx="32" cy="11" r="1.5" fill="#7dd3fc" />
  <circle cx="32" cy="53" r="1.5" fill="#c084fc" />
