      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020307" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="omegaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
